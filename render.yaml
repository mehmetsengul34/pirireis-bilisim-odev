services:
  - type: web
    name: pirireis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pirireis-db
          property: connectionString
      - key: GEMINI_API_KEY
        value: AQ.Ab8RN6KTlFTwqsmAA4YcVjqjzyAF33MGmAThB3F5MvbZZQqSxw

databases:
  - name: pirireis-db
    plan: free
