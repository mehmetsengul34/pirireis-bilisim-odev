services:
  - type: web
    name: pirireis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    # GÜVENLİK: Gizli değerler bu dosyaya YAZILMAZ.
    # "sync: false" olan değerler Render panelinde (Environment sekmesi) elle girilir.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LAB_DESKTOP_MASTER_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
