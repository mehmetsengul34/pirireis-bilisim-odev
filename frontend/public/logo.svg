<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36"/>
      <stop offset="50%" stop-color="#061226"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>

    <!-- Tech Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Golden Compass Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Dark Gold -->
    <linearGradient id="darkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield / Circle Container -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Circuit Lines & Microchip Traces in Background -->
  <g stroke="url(#cyanGrad)" stroke-width="2" opacity="0.4" fill="none">
    <!-- Top-left traces -->
    <path d="M 120 160 L 170 160 L 190 190 L 220 190"/>
    <circle cx="120" cy="160" r="4" fill="#38bdf8"/>
    <!-- Top-right traces -->
    <path d="M 380 160 L 330 160 L 310 190 L 280 190"/>
    <circle cx="380" cy="160" r="4" fill="#38bdf8"/>
    <!-- Bottom-left traces -->
    <path d="M 120 340 L 170 340 L 190 310 L 220 310"/>
    <circle cx="120" cy="340" r="4" fill="#38bdf8"/>
    <!-- Bottom-right traces -->
    <path d="M 380 340 L 330 340 L 310 310 L 280 310"/>
    <circle cx="380" cy="340" r="4" fill="#38bdf8"/>
  </g>

  <!-- Compass Dial Degree Marks -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.7">
    <line x1="250" y1="42" x2="250" y2="58"/>
    <line x1="250" y1="442" x2="250" y2="458"/>
    <line x1="42" y1="250" x2="58" y2="250"/>
    <line x1="442" y1="250" x2="458" y2="250"/>
    <!-- Diagonals -->
    <line x1="103" y1="103" x2="114" y2="114"/>
    <line x1="397" y1="103" x2="386" y2="114"/>
    <line x1="103" y1="397" x2="114" y2="386"/>
    <line x1="397" y1="397" x2="386" y2="386"/>
  </g>

  <!-- Piri Reis Compass Rose (Wind Rose) Multi-pointed Star -->
  <!-- Secondary Compass Points (Cyan) -->
  <polygon points="250,250 250,110 262,238" fill="url(#cyanGrad)" opacity="0.8"/>
  <polygon points="250,250 250,110 238,238" fill="#0369a1" opacity="0.8"/>
  <polygon points="250,250 250,390 262,262" fill="#0369a1" opacity="0.8"/>
  <polygon points="250,250 250,390 238,262" fill="url(#cyanGrad)" opacity="0.8"/>
  <polygon points="250,250 390,250 262,238" fill="url(#cyanGrad)" opacity="0.8"/>
  <polygon points="250,250 390,250 262,262" fill="#0369a1" opacity="0.8"/>
  <polygon points="250,250 110,250 238,238" fill="#0369a1" opacity="0.8"/>
  <polygon points="250,250 110,250 238,262" fill="url(#cyanGrad)" opacity="0.8"/>

  <!-- Diagonal Points (Gold & Tech) -->
  <polygon points="250,250 350,150 265,240" fill="url(#goldGrad)" opacity="0.9"/>
  <polygon points="250,250 350,150 240,265" fill="url(#darkGoldGrad)" opacity="0.9"/>
  <polygon points="250,250 150,150 235,240" fill="url(#darkGoldGrad)" opacity="0.9"/>
  <polygon points="250,250 150,150 260,235" fill="url(#goldGrad)" opacity="0.9"/>
  <polygon points="250,250 350,350 240,265" fill="url(#goldGrad)" opacity="0.9"/>
  <polygon points="250,250 350,350 265,240" fill="url(#darkGoldGrad)" opacity="0.9"/>
  <polygon points="250,250 150,350 260,265" fill="url(#darkGoldGrad)" opacity="0.9"/>
  <polygon points="250,250 150,350 235,260" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Primary North Star Point (Piri Reis Navigation Needle) -->
  <polygon points="250,250 250,68 266,234" fill="url(#goldGrad)" filter="url(#glow)"/>
  <polygon points="250,250 250,68 234,234" fill="url(#darkGoldGrad)"/>
  <!-- South Needle -->
  <polygon points="250,250 250,432 234,266" fill="url(#goldGrad)"/>
  <polygon points="250,250 250,432 266,266" fill="url(#darkGoldGrad)"/>
  <!-- East Needle -->
  <polygon points="250,250 432,250 266,234" fill="url(#goldGrad)"/>
  <polygon points="250,250 432,250 266,266" fill="url(#darkGoldGrad)"/>
  <!-- West Needle -->
  <polygon points="250,250 68,250 234,266" fill="url(#goldGrad)"/>
  <polygon points="250,250 68,250 234,234" fill="url(#darkGoldGrad)"/>

  <!-- Center Microchip / Tech Core -->
  <rect x="220" y="220" width="60" height="60" rx="10" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="14" fill="url(#cyanGrad)"/>
  
  <!-- Microchip Pins -->
  <g stroke="#38bdf8" stroke-width="2">
    <!-- Top Pins -->
    <line x1="232" y1="220" x2="232" y2="212"/>
    <line x1="250" y1="220" x2="250" y2="212"/>
    <line x1="268" y1="220" x2="268" y2="212"/>
    <!-- Bottom Pins -->
    <line x1="232" y1="280" x2="232" y2="288"/>
    <line x1="250" y1="280" x2="250" y2="288"/>
    <line x1="268" y1="280" x2="268" y2="288"/>
    <!-- Left Pins -->
    <line x1="220" y1="232" x2="212" y2="232"/>
    <line x1="220" y1="250" x2="212" y2="250"/>
    <line x1="220" y1="268" x2="212" y2="268"/>
    <!-- Right Pins -->
    <line x1="280" y1="232" x2="288" y2="232"/>
    <line x1="280" y1="250" x2="288" y2="250"/>
    <line x1="280" y1="268" x2="288" y2="268"/>
  </g>

  <!-- Binary Code Decorative Ring -->
  <g fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" opacity="0.6">
    <text x="238" y="98">01</text>
    <text x="390" y="254">10</text>
    <text x="242" y="415">11</text>
    <text x="92" y="254">00</text>
  </g>
</svg>
