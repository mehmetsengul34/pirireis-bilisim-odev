<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klasik Gitar VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: full-bleed 3D stage; name and VR entry on top, chord dock at the bottom. Single night-stage theme. */
  --night: #0b121d;
  --panel: rgba(14, 24, 38, 0.82);
  --line: rgba(214, 228, 245, 0.16);
  --text: #eef2f6;
  --muted: #a3b3c4;
  --accent: #f2b84b;
  --accent-ink: #1d1503;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.overlay { position: fixed; left: 0; right: 0; pointer-events: none; padding: 16px; }
.bar { top: 0; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.brand { max-width: 46ch; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); }
#hint { color: var(--text); margin-top: 6px; }
button { font: inherit; color: inherit; cursor: pointer; pointer-events: auto; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  padding: 12px 20px; font-weight: 600; font-size: 16px;
}
.primary:disabled { background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: default; }
.dock { bottom: 0; display: flex; gap: 12px 24px; align-items: flex-end; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(8px); }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 44px;
  font-weight: 600; display: inline-flex; gap: 6px; align-items: baseline; justify-content: center;
}
.chip kbd { font: inherit; font-size: 11px; font-weight: 400; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] kbd { color: var(--accent-ink); opacity: 0.7; }
.chip:hover { border-color: var(--accent); }
@media (max-width: 520px) {
  .brand h1 { font-size: 21px; }
  .overlay { padding: 12px 16px; }
  .chip kbd { display: none; }
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="overlay bar">
  <div class="brand">
    <h1>Klasik Gitar VR</h1>
    <p id="status">VR desteği kontrol ediliyor.</p>
    <p id="hint">Ses için bir kez tıklayın, sonra fareyi tellerin üzerinden geçirin.</p>
  </div>
  <button id="vrBtn" class="primary" type="button" disabled>VR'a gir</button>
</header>

<footer class="overlay dock">
  <div class="group">
    <span class="label">Akor (sol el)</span>
    <div id="chords" class="chips"></div>
  </div>
  <div class="group">
    <span class="label">VR'da sol el</span>
    <div class="chips">
      <button id="modeChord" class="chip" type="button" aria-pressed="true">Akor bölgeleri</button>
      <button id="modeFree" class="chip" type="button" aria-pressed="false">Serbest parmak</button>
    </div>
  </div>
  <div class="group">
    <span class="label">VR'da tutuş</span>
    <div class="chips">
      <button id="holdFree" class="chip" type="button" aria-pressed="true">Serbest</button>
      <button id="holdStrap" class="chip" type="button" aria-pressed="false">Askılı</button>
    </div>
  </div>
  <div class="group">
    <span class="label">Dinle</span>
    <div class="chips">
      <button id="demoBtn" class="chip" type="button" aria-pressed="false">Örnek çal</button>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* ---------- Guitar geometry constants (metres, guitar-local frame) ----------
   +X: bridge -> headstock, +Y: toward bass strings, +Z: out of the soundboard.
   Origin sits at the soundhole. */
var L = 0.65;                       // scale length of a classical guitar
var X_NUT = 0.50, X_BRIDGE = X_NUT - L;
function fretX(n) { return X_NUT - L * (1 - Math.pow(2, -n / 12)); }
var X_JOINT = fretX(12), X_FB_END = fretX(19);
var FB_TOP = 0.006;
var NUT_SP = 0.0086, BR_SP = 0.0116;
function spacing(x) { return NUT_SP + (BR_SP - NUT_SP) * ((X_NUT - x) / L); }
function stringY(i, x) { return (2.5 - i) * spacing(x); }
function stringZ(x) { return 0.0078 + 0.0047 * ((X_NUT - x) / L); }
function fbHalf(x) { return 0.026 + 0.005 * ((X_NUT - x) / (X_NUT - X_JOINT)); }
function fretAt(x) {
  var d = X_NUT - x;
  if (d <= 0) return 0;
  return Math.max(1, Math.min(19, Math.ceil(12 * Math.log(L / (L - d)) / Math.LN2 - 1e-6)));
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

var OPEN_MIDI = [40, 45, 50, 55, 59, 64];   // E2 A2 D3 G3 B3 E4
var CHORDS = {
  'Açık': [0, 0, 0, 0, 0, 0],
  'Em': [0, 2, 2, 0, 0, 0],
  'Am': [-1, 0, 2, 2, 1, 0],
  'C':  [-1, 3, 2, 0, 1, 0],
  'G':  [3, 2, 0, 0, 0, 3],
  'D':  [-1, -1, 0, 2, 3, 2],
  'F':  [1, 3, 3, 2, 1, 1],
  'Dm': [-1, -1, 0, 2, 3, 1],
  'E':  [0, 2, 2, 1, 0, 0],
  'A':  [-1, 0, 2, 2, 2, 0]
};
var CHORD_ORDER = ['Açık', 'Em', 'Am', 'C', 'G', 'D', 'F', 'Dm', 'E', 'A'];
var ZONE_CHORDS = ['C', 'G', 'Am', 'F', 'Em', 'Dm'];   // from the nut toward the body
var ZONE_START = X_NUT + 0.03, ZONE_LEN = (ZONE_START - X_JOINT) / ZONE_CHORDS.length;

var frets = [0, 0, 0, 0, 0, 0];
var chordName = 'Açık';
var vrMode = 'chord';               // 'chord' | 'free'
var holdMode = 'free';              // 'free': pick it up with your hands | 'strap': always worn
var state = 'rest';                 // 'rest' | 'carry' | 'play'
var standReady = false;

/* ---------- Audio: Karplus-Strong plucked nylon string ---------- */
var ctx = null, bodyIn = null;
var noteCache = {};
var voices = [null, null, null, null, null, null];

function initAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ctx = new AC(); } catch (e) { ctx = null; return; }
  bodyIn = ctx.createGain();
  var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 70;
  var pk1 = ctx.createBiquadFilter(); pk1.type = 'peaking'; pk1.frequency.value = 105; pk1.Q.value = 1.2; pk1.gain.value = 5;
  var pk2 = ctx.createBiquadFilter(); pk2.type = 'peaking'; pk2.frequency.value = 215; pk2.Q.value = 1.5; pk2.gain.value = 3;
  var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
  var comp = ctx.createDynamicsCompressor();
  var out = ctx.createGain(); out.gain.value = 0.9;
  bodyIn.connect(hp); hp.connect(pk1); pk1.connect(pk2); pk2.connect(lp);
  lp.connect(comp);
  // Small-room tail
  var conv = ctx.createConvolver();
  var sr = ctx.sampleRate, n = Math.floor(sr * 1.3);
  var ir = ctx.createBuffer(2, n, sr);
  for (var c = 0; c < 2; c++) {
    var d = ir.getChannelData(c);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2);
  }
  conv.buffer = ir;
  var wet = ctx.createGain(); wet.gain.value = 0.2;
  lp.connect(conv); conv.connect(wet); wet.connect(comp);
  comp.connect(out); out.connect(ctx.destination);
  var hint = document.getElementById('hint');
  if (hint) hint.textContent = 'Fareyi gövdedeki tellerin üzerinden geçirin. Perdeye tıklayarak nota değiştirin. Boşluk: tüm tellere vur.';
}

function noteBuffer(midi) {
  if (noteCache[midi]) return noteCache[midi];
  var sr = ctx.sampleRate, f = 440 * Math.pow(2, (midi - 69) / 12);
  var dur = midi < 52 ? 4.0 : (midi < 64 ? 3.2 : 2.6);
  var len = Math.floor(sr * dur);
  var buf = ctx.createBuffer(1, len, sr), out = buf.getChannelData(0);
  var s = 0.5 - 0.14 * clamp((midi - 52) / 28, 0, 1);       // loop damping filter
  var P = sr / f, N = Math.floor(P - s), fr = P - s - N;
  if (fr < 0.1) { N -= 1; fr += 1; }
  var C = (1 - fr) / (1 + fr);                               // all-pass for fine tuning
  var dl = new Float32Array(N), i;
  var a = midi < 55 ? 0.42 : 0.3, v1 = 0, v2 = 0, mean = 0;
  for (i = 0; i < N; i++) { var w = Math.random() * 2 - 1; v1 += a * (w - v1); v2 += a * (v1 - v2); dl[i] = v2; mean += v2; }
  mean /= N;
  var off = Math.max(1, Math.floor(N * 0.2)), tmp = new Float32Array(N), peak = 0;
  for (i = 0; i < N; i++) { tmp[i] = (dl[i] - mean) - 0.55 * (dl[(i + off) % N] - mean); if (Math.abs(tmp[i]) > peak) peak = Math.abs(tmp[i]); }
  for (i = 0; i < N; i++) dl[i] = tmp[i] / (peak || 1) * 0.9;
  var t60 = 4.6 - 2.6 * clamp((midi - 40) / 40, 0, 1);
  var g = Math.pow(10, -3 / (t60 * f));
  var ptr = 0, x1 = 0, apx = 0, apy = 0, fade = Math.floor(sr * 0.06);
  for (var n = 0; n < len; n++) {
    var x0 = dl[ptr];
    var lpf = g * ((1 - s) * x0 + s * x1); x1 = x0;
    var y = C * lpf + apx - C * apy; apx = lpf; apy = y;
    dl[ptr] = y;
    out[n] = n > len - fade ? x0 * (len - n) / fade : x0;
    ptr++; if (ptr >= N) ptr = 0;
  }
  noteCache[midi] = buf;
  return buf;
}

function playString(i, vel, delay) {
  if (!ctx || ctx.state !== 'running') return;
  var t = ctx.currentTime + (delay || 0);
  var old = voices[i];
  if (old) {
    try { old.g.gain.cancelScheduledValues(t); old.g.gain.setTargetAtTime(0, t, 0.012); old.src.stop(t + 0.12); } catch (e) {}
  }
  var src = ctx.createBufferSource(); src.buffer = noteBuffer(OPEN_MIDI[i] + frets[i]);
  var flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 900 + vel * 5200;
  var g = ctx.createGain(); g.gain.value = Math.pow(vel, 1.3) * 0.55;
  src.connect(flt); flt.connect(g); g.connect(bodyIn);
  src.start(t);
  voices[i] = { src: src, g: g };
}

/* ---------- Scene ---------- */
var canvas = document.getElementById('stage');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.xr.enabled = true;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b121d);
var camera = new THREE.PerspectiveCamera(50, 1, 0.01, 60);

function canvasTex(w, h, draw) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

// Sky dome and floor pool of light
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(25, 24, 16),
  new THREE.MeshBasicMaterial({ side: THREE.BackSide, map: canvasTex(8, 256, function (g, w, h) {
    var gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#070c14'); gr.addColorStop(0.48, '#1b3044'); gr.addColorStop(0.56, '#16222f'); gr.addColorStop(1, '#090d13');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }) })
));
var floor = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 48),
  new THREE.MeshBasicMaterial({ map: canvasTex(256, 256, function (g, w, h) {
    var gr = g.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
    gr.addColorStop(0, '#6a4a2e'); gr.addColorStop(0.35, '#3a2a1d'); gr.addColorStop(1, '#0c1017');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }) })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0xd3e2ff, 0x3a2a1c, 0.85));
var key = new THREE.DirectionalLight(0xffe6c4, 0.95); key.position.set(0.8, 2.2, 1.5); scene.add(key);
var rim = new THREE.DirectionalLight(0x8fb0ff, 0.45); rim.position.set(-1.5, 1.2, -1.2); scene.add(rim);

/* ---------- Guitar model ---------- */
var guitar = new THREE.Group(); scene.add(guitar);
var V3 = THREE.Vector3;

function cyl(a, b, r, mat, seg) {
  var d = new V3().subVectors(b, a);
  var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), seg || 8, 1), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.clone().normalize());
  return m;
}
function box(sx, sy, sz, x, y, z, mat) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat); m.position.set(x, y, z); return m;
}

var matTop = new THREE.MeshStandardMaterial({ roughness: 0.42, metalness: 0, map: (function () {
  var t = canvasTex(256, 256, function (g, w, h) {
    g.fillStyle = '#d9a75e'; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 110; i++) {
      g.strokeStyle = 'rgba(' + (110 + Math.random() * 40 | 0) + ',' + (62 + Math.random() * 25 | 0) + ',18,' + (0.05 + Math.random() * 0.16) + ')';
      g.lineWidth = 1 + Math.random() * 1.5;
      var y = Math.random() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 9); return t;
})() });
var matSide = new THREE.MeshStandardMaterial({ color: 0x4d2515, roughness: 0.4 });
var matNeck = new THREE.MeshStandardMaterial({ color: 0x6e3c20, roughness: 0.5 });
var matEbony = new THREE.MeshStandardMaterial({ color: 0x1c1310, roughness: 0.6 });
var matFret = new THREE.MeshStandardMaterial({ color: 0xcfd2d4, roughness: 0.3, metalness: 0.85 });
var matBone = new THREE.MeshStandardMaterial({ color: 0xf2ead6, roughness: 0.5 });
var matDark = new THREE.MeshStandardMaterial({ color: 0x0e0907, roughness: 0.9 });

(function buildBody() {
  var half = [[0.175, 0], [0.171, 0.055], [0.15, 0.112], [0.09, 0.14], [0.03, 0.128], [-0.02, 0.118],
              [-0.08, 0.146], [-0.17, 0.185], [-0.26, 0.158], [-0.305, 0.085], [-0.315, 0]];
  var pts = [], i;
  for (i = 0; i < half.length; i++) pts.push(new V3(half[i][0], half[i][1], 0));
  for (i = half.length - 2; i > 0; i--) pts.push(new V3(half[i][0], -half[i][1], 0));
  var loop = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5).getPoints(180);
  var shape = new THREE.Shape(loop.map(function (p) { return new THREE.Vector2(p.x, p.y); }));
  var depth = 0.095, bev = 0.004;
  var geo = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 2, curveSegments: 1 });
  geo.translate(0, 0, -(depth + bev));
  guitar.add(new THREE.Mesh(geo, [matTop, matSide]));
  var back = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({ color: 0x4d2515, roughness: 0.4, side: THREE.BackSide }));
  back.position.z = -(depth + 2 * bev) - 0.0004; guitar.add(back);

  // Rosette and soundhole
  var ros = new THREE.Mesh(new THREE.CircleGeometry(0.062, 64), new THREE.MeshStandardMaterial({
    transparent: true, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    map: canvasTex(256, 256, function (g, w) {
      var c = w / 2, k;
      g.clearRect(0, 0, w, w);
      g.fillStyle = '#3a1d10'; g.beginPath(); g.arc(c, c, 125, 0, 7); g.fill();
      var cols = ['#e8c67a', '#7b2d1c', '#f3e6c4', '#27412f'];
      for (k = 0; k < 64; k++) {
        g.fillStyle = cols[k % 4]; g.beginPath(); g.moveTo(c, c);
        g.arc(c, c, 116, k / 64 * Math.PI * 2, (k + 1) / 64 * Math.PI * 2); g.fill();
      }
      g.fillStyle = '#3a1d10'; g.beginPath(); g.arc(c, c, 100, 0, 7); g.fill();
      g.strokeStyle = '#f3e6c4'; g.lineWidth = 2;
      g.beginPath(); g.arc(c, c, 121, 0, 7); g.stroke(); g.beginPath(); g.arc(c, c, 95, 0, 7); g.stroke();
      g.fillStyle = '#080504'; g.beginPath(); g.arc(c, c, 89, 0, 7); g.fill();
    })
  }));
  ros.position.set(0.015, 0, 0.0006); guitar.add(ros);

  // Bridge and saddle
  guitar.add(box(0.028, 0.185, 0.009, X_BRIDGE - 0.006, 0, 0.0045, matSide));
  guitar.add(box(0.003, 0.085, 0.004, X_BRIDGE, 0, 0.0105, matBone));
})();

(function buildNeck() {
  function trap(x0, x1) {
    var s = new THREE.Shape();
    s.moveTo(x0, -fbHalf(x0)); s.lineTo(x1, -fbHalf(x1)); s.lineTo(x1, fbHalf(x1)); s.lineTo(x0, fbHalf(x0)); s.closePath();
    return s;
  }
  guitar.add(new THREE.Mesh(new THREE.ExtrudeGeometry(trap(X_FB_END, X_NUT), { depth: FB_TOP, bevelEnabled: false }), matEbony));
  var slab = new THREE.ExtrudeGeometry(trap(X_JOINT, X_NUT), { depth: 0.012, bevelEnabled: false }); slab.translate(0, 0, -0.012);
  guitar.add(new THREE.Mesh(slab, matNeck));
  var round = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.031, X_NUT - X_JOINT, 18), matNeck);
  round.rotation.z = -Math.PI / 2; round.scale.z = 0.6; round.position.set((X_NUT + X_JOINT) / 2, 0, -0.010); guitar.add(round);
  guitar.add(box(0.035, 0.05, 0.085, X_JOINT + 0.0175, 0, -0.0525, matNeck));
  for (var n = 1; n <= 19; n++) guitar.add(box(0.0018, 2 * fbHalf(fretX(n)), 0.0012, fretX(n), 0, FB_TOP + 0.0006, matFret));
  guitar.add(box(0.005, 0.052, 0.009, X_NUT + 0.0025, 0, 0.004, matBone));

  // Headstock
  var head = new THREE.Group(); head.position.set(X_NUT + 0.005, 0, -0.001); head.rotation.y = 0.21; guitar.add(head);
  head.add(box(0.185, 0.07, 0.017, 0.0925, 0, -0.0085, matNeck));
  var rx = [0.045, 0.085, 0.125], sgn, k;
  for (sgn = -1; sgn <= 1; sgn += 2) {
    head.add(box(0.105, 0.011, 0.018, 0.085, sgn * 0.018, -0.0085, matDark));
    for (k = 0; k < 3; k++) {
      head.add(cyl(new V3(rx[k], sgn * 0.0125, -0.0085), new V3(rx[k], sgn * 0.0235, -0.0085), 0.0032, matBone, 10));
      head.add(cyl(new V3(rx[k], sgn * 0.035, -0.0085), new V3(rx[k], sgn * 0.052, -0.0085), 0.002, matFret, 6));
      var knob = new THREE.Mesh(new THREE.SphereGeometry(0.008, 12, 8), matBone);
      knob.scale.set(1, 0.5, 1.3); knob.position.set(rx[k], sgn * 0.055, -0.0085); head.add(knob);
    }
  }
  head.updateMatrix();
  buildNeck.head = head; buildNeck.rx = rx;
})();

// Strings
var STR_R = [0.0011, 0.00095, 0.0008, 0.0007, 0.0006, 0.00055];
var strings = [];
(function buildStrings() {
  // The headstock group was the last Group added to the guitar
  var head = null;
  guitar.children.forEach(function (c) { if (c.type === 'Group') head = c; });
  var inv = new THREE.Matrix4().copy(head.matrix).invert();
  var rx = [0.045, 0.085, 0.125];
  for (var i = 0; i < 6; i++) {
    var mat = i < 3
      ? new THREE.MeshStandardMaterial({ color: 0xd8dbde, metalness: 0.85, roughness: 0.35, transparent: true })
      : new THREE.MeshStandardMaterial({ color: 0xf7f2e3, roughness: 0.3, transparent: true, opacity: 0.92 });
    var a = new V3(X_NUT, stringY(i, X_NUT), stringZ(X_NUT)), b = new V3(X_BRIDGE, stringY(i, X_BRIDGE), stringZ(X_BRIDGE));
    var m = cyl(a, b, STR_R[i], mat, 6); guitar.add(m);

  // Body anchor: follows the head position, turns only after a clear turn of the head
  if (!anchorReady) { anchorPos.copy(headPos); anchorYaw = lastYaw; anchorReady = true; }
  anchorPos.lerp(headPos, 1 - Math.exp(-dt * 2.5));
  var dy = Math.atan2(Math.sin(lastYaw - anchorYaw), Math.cos(lastYaw - anchorYaw));
  if (Math.abs(dy) > 0.75) yawFollowing = true;
  if (yawFollowing) { anchorYaw += dy * (1 - Math.exp(-dt * 3)); if (Math.abs(dy) < 0.08) yawFollowing = false; }
  aF.set(-Math.sin(anchorYaw), 0, -Math.cos(anchorYaw));
  aR.set(Math.cos(anchorYaw), 0, -Math.sin(anchorYaw));

  readInputs(frame, session, ref);
  drawHand(hands.left); drawHand(hands.right);

  fromAnchor(playSpot, 0.08, -0.42, 0.22).add(anchorPos);
  fromAnchor(defDir, -0.86, 0.38, 0.2).normalize();
  fromAnchor(zRef, 0, 0.6, 1);
  var LH = hands.left, RH = hands.right;
  var cl = gripClosed(LH), cr = gripClosed(RH);
  var riseL = cl && !LH.closed, riseR = cr && !RH.closed;
  LH.closed = cl; RH.closed = cr;

  if (holdMode === 'strap') { if (state !== 'play') enterPlay(); }
  else {
    if (!standReady) placeStand();
    var dSpot = guitar.position.distanceTo(playSpot);
    if (blockPlay && dSpot > 0.32) blockPlay = false;
    if (state === 'rest') {
      if (riseL && nearGuitar(LH)) startCarry(LH);
      else if (riseR && nearGuitar(RH)) startCarry(RH);
    } else if (state === 'carry') {
      var ch = carryHand;
      if (!ch.kind) setState('rest');
      else {
        if (ch.ok[0] && ch.qok) {
          handM.compose(ch.j[0], ch.q, ONE); gM.multiplyMatrices(handM, carryOff);
          gM.decompose(guitar.position, guitar.quaternion, scl);
        }
        dSpot = guitar.position.distanceTo(playSpot);
        if (!blockPlay && dSpot < 0.2) enterPlay();
        else if (!ch.closed) {
          if (dSpot < 0.28) enterPlay();
          else if (guitar.position.distanceTo(standPivot) < 0.3) toStand();
          else setState('rest');
        }
      }
    }
  }

  // Playing position: soundbox rests at the belly, neck aims at the left hand while it holds the neck
  var g = null;
  if (state === 'play') {
    pivotCur.lerp(playSpot, 1 - Math.exp(-dt * 12));
    g = gripPoint(LH, grip);
    if (g) {
      tmp.copy(g).sub(pivotCur);
      var dist = tmp.length(), ang = tmp.angleTo(defDir);
      if (!held) {
        tmp2.copy(g); guitar.worldToLocal(tmp2);
        held = ang < 0.87 && tmp2.x > 0.16 && tmp2.x < 0.62 && Math.hypot(tmp2.y, tmp2.z) < 0.09;
      } else if (dist < 0.14 || dist > 0.68 || ang > 0.96) {
        held = false;
        // Pulling the neck far away with a closed hand lifts the guitar off the body
        if (holdMode === 'free' && cl) { blockPlay = true; startCarry(LH); }
      }
    } else held = false;
  }
  if (state === 'play') {
    if (held) {
      tgtDir.copy(g).sub(pivotCur).normalize();
      var a = tgtDir.angleTo(defDir);
      if (a > 0.87) tgtDir.lerp(defDir, 1 - 0.87 / a).normalize();
    } else tgtDir.copy(defDir);
    neckDir.lerp(tgtDir, 1 - Math.exp(-dt * (held ? 18 : 6))).normalize();
    orientGuitar(neckDir, zRef, 1 - Math.exp(-dt * 25));
    guitar.position.copy(pivotCur);
  }
  guitar.updateMatrixWorld(true);
  zoneGroup.visible = vrMode === 'chord' && state === 'play';

  // Left hand: chord zones or free fretting
  var lh = hands.left, i;
  if (vrMode === 'chord') {
    var name = 'Açık';
    if (state === 'play' && held) {
      tmp2.copy(g); guitar.worldToLocal(tmp2);
      var u = (ZONE_START - tmp2.x) / ZONE_LEN;
      if (zoneIdx < 0 || Math.abs(u - (zoneIdx + 0.5)) > 0.64) zoneIdx = clamp(Math.floor(u), 0, ZONE_CHORDS.length - 1);
      name = ZONE_CHORDS[zoneIdx];
    } else zoneIdx = -1;
    setChord(name);
  } else {
    var next = [0, 0, 0, 0, 0, 0];
    if (state === 'play' && lh.kind === 'hand') {
      ['index-finger-tip', 'middle-finger-tip', 'ring-finger-tip', 'pinky-finger-tip'].forEach(function (n) {
        var k = JI[n]; if (!lh.ok[k]) return;
        tmp2.copy(lh.j[k]); guitar.worldToLocal(tmp2);
        var z = tmp2.z - FB_TOP;
        if (tmp2.x < X_FB_END || tmp2.x > X_NUT || Math.abs(tmp2.y) > fbHalf(tmp2.x) + 0.006 || z < -0.02 || z > 0.03) return;
        var si = clamp(Math.round(2.5 - tmp2.y / spacing(tmp2.x)), 0, 5);
        next[si] = Math.max(next[si], fretAt(tmp2.x));
      });
    }
    applyFrets(next, 'özel');
  }

  // Right hand: fingertips pluck
  var rh = hands.right;
  var rightTips = rh.kind === 'hand' ? ['thumb-tip', 'index-finger-tip', 'middle-finger-tip'] : (rh.kind === 'ctrl' ? ['wrist'] : []);
  ['thumb-tip', 'index-finger-tip', 'middle-finger-tip', 'wrist'].forEach(function (n) {
    var k = JI[n];
    if (state === 'carry' || rightTips.indexOf(n) < 0 || !rh.ok[k]) { tips['r-' + n] = null; return; }
    tmp2.copy(rh.j[k]); guitar.worldToLocal(tmp2);
    processTip('r-' + n, tmp2, now, -0.022, 0.035);
  });

  // Panel: up and to the right, poke the button with an index finger to switch mode
  fromAnchor(panel.position, 0.44, -0.16, 0.5).add(anchorPos);
  panel.lookAt(headPos);
  panel.updateMatrixWorld(true);
  var inside = [false, false];
  [hands.left, hands.right].forEach(function (h) {
    var k = h.kind === 'hand' ? JI['index-finger-tip'] : 0;
    if (!h.kind || !h.ok[k] || (state === 'carry' && h === carryHand)) return;
    tmp2.copy(h.j[k]); panel.worldToLocal(tmp2);
    if (Math.abs(tmp2.x) > 0.12 || Math.abs(tmp2.z) > 0.025) return;
    if (tmp2.y < 0.015 && tmp2.y > -0.035) inside[0] = true;
    else if (tmp2.y < -0.0425 && tmp2.y > -0.0925) inside[1] = true;
  });
  for (var b = 0; b < 2; b++) {
    if (inside[b] && !panelInside[b] && now - panelLast > 0.7) {
      panelLast = now;
      if (b === 0) setMode(vrMode === 'chord' ? 'free' : 'chord'); else setHold(holdMode === 'free' ? 'strap' : 'free');
    }
    panelInside[b] = inside[b];
  }
}

/* ---------- VR session ---------- */
var vrBtn = document.getElementById('vrBtn'), statusEl = document.getElementById('status');
var xrSession = null;
function vrUnavailable(msg) { vrBtn.disabled = true; vrBtn.textContent = 'VR kullanılamıyor'; statusEl.textContent = msg; }
var NO_VR = 'Bu pencerede VR oturumu açılamıyor. Masaüstü önizlemesi çalışır; VR için sayfayı gözlüğün tarayıcısında açın.';
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
    if (!ok) { vrUnavailable(NO_VR); return; }
    vrBtn.disabled = false;
    statusEl.textContent = 'VR hazır. Kumandaları bırakıp ellerinizi kullanın; gitar sağ önünüzdeki standda bekler.';
  }).catch(function () { vrUnavailable(NO_VR); });
} else vrUnavailable(NO_VR);

function startSession(session, floorSpace) {
  xrSession = session;
  renderer.xr.setReferenceSpaceType(floorSpace ? 'local-floor' : 'local');
  return renderer.xr.setSession(session);
}
vrBtn.addEventListener('click', function () {
  initAudio();
  if (xrSession) { xrSession.end(); return; }
  if (demoTimer) toggleDemo();
  navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] }).then(function (session) {
    session.addEventListener('end', function () {
      xrSession = null; vrBtn.textContent = "VR'a gir";
      hands.left.group.visible = hands.right.group.visible = false; panel.visible = false; stand.visible = false;
      if (floorDropped) { floor.position.y = 0; floorDropped = false; }
      setChord('Açık'); desktopPose(); resize();
    });
    anchorReady = false; held = false; tips = {}; state = 'rest'; standReady = false; blockPlay = false;
    hands.left.closed = hands.right.closed = false;
    vrBtn.textContent = "VR'dan çık";
    panel.visible = true; drawPanel();
    return startSession(session, true).catch(function () {
      floor.position.y = -1.5; floorDropped = true;
      return startSession(session, false);
    });
  }).catch(function (err) {
    statusEl.textContent = 'VR oturumu başlatılamadı: ' + (err && err.message ? err.message : 'bilinmeyen hata') + '.';
  });
});

/* ---------- Loop ---------- */
var lastT = 0;
renderer.setAnimationLoop(function (ms, frame) {
  var now = ms / 1000, dt = Math.min(0.05, Math.max(0.001, now - lastT)); lastT = now;
  if (renderer.xr.isPresenting && frame) updateXR(frame, performance.now() / 1000, dt);
  for (var i = 0; i < 6; i++) {
    var s = strings[i];
    if (s.amp > 0.00002) { s.amp *= Math.exp(-dt * 2.4); s.mesh.position.y = s.baseY + s.amp * Math.sin(now * (150 + i * 23)); }
    else if (s.amp !== 0) { s.amp = 0; s.mesh.position.y = s.baseY; }
  }
  renderer.render(scene, camera);
});

buildZones(); drawPanel(); desktopPose(); resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { buildZones(); drawPanel(); });
window.__guitar = { renderer: renderer, updateXR: updateXR, guitar: guitar, hands: hands, getState: function () { return state + '/' + chordName + '/' + held; }, strum: strum, setChord: setChord, frets: frets, tips: tips, processTip: processTip, strings: strings };
})();
</script>
</body>
</html>
